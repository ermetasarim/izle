<!DOCTYPE html>
<html lang="tr"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Izleme Listesi | Pars Studio</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#070b12;--p:#10182a;--line:rgba(255,255,255,.08);--t:#e8eef8;--m:#8b9bb4;--a:#f5c15d;--b:#5aa7ff}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font-family:"IBM Plex Sans",sans-serif}
.wrap{width:min(980px,calc(100% - 28px));margin:auto;padding:28px 0 60px}
header{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:18px}
h1{margin:0;font-size:20px}.sub{color:var(--m);font-size:12px}
.btn,input,select{background:var(--p);border:1px solid var(--line);color:var(--t);border-radius:10px;padding:10px 12px;font-family:inherit}
.btn{cursor:pointer;font-weight:700;text-decoration:none}.pri{background:#16477d;border-color:#2b5d93}
.form{display:grid;grid-template-columns:2fr 1fr 1fr auto;gap:8px;margin-bottom:14px}
.tabs{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.card{background:linear-gradient(180deg,#121b2e,#0e1626);border:1px solid var(--line);border-radius:16px;padding:14px}
.tag{font-size:11px;padding:2px 8px;border-radius:99px;background:rgba(90,167,255,.12);color:var(--b)}
.stars{color:var(--a);letter-spacing:2px}
@media(max-width:700px){.form{grid-template-columns:1fr}}
</style></head>
<body>
<div class="wrap">
  <header><div><h1>IZLEME LISTESI</h1><div class="sub">Film / dizi rafi</div></div>
  <a class="btn" href="https://ermetasarim.github.io/projeler/">Portfoy</a></header>
  <div class="form">
    <input id="ad" placeholder="Film veya dizi adi">
    <select id="tur"><option>Film</option><option>Dizi</option></select>
    <select id="durum"><option value="sirada">Sirada</option><option value="izliyorum">Izliyorum</option><option value="bitti">Bitti</option></select>
    <button class="btn pri" onclick="ekle()">Ekle</button>
  </div>
  <div class="tabs">
    <button class="btn" onclick="filtre('hepsi',this)">Hepsi</button>
    <button class="btn" onclick="filtre('sirada',this)">Sirada</button>
    <button class="btn" onclick="filtre('izliyorum',this)">Izliyorum</button>
    <button class="btn" onclick="filtre('bitti',this)">Bitti</button>
  </div>
  <div class="grid" id="box"></div>
</div>
<script>
const KEY="pars_izle_v1";
let items=JSON.parse(localStorage.getItem(KEY)||"null")||[
  {id:"1",ad:"Parasite",tur:"Film",durum:"bitti",puan:5},
  {id:"2",ad:"The Bear",tur:"Dizi",durum:"izliyorum",puan:4},
  {id:"3",ad:"Dune: Part Two",tur:"Film",durum:"sirada",puan:0}
];
const save=()=>localStorage.setItem(KEY,JSON.stringify(items));
let f="hepsi";
const lab={sirada:"Sirada",izliyorum:"Izliyorum",bitti:"Bitti"};
function ekle(){const ad=document.getElementById("ad").value.trim(); if(!ad) return; items.unshift({id:Date.now().toString(36),ad,tur:document.getElementById("tur").value,durum:document.getElementById("durum").value,puan:0}); document.getElementById("ad").value=""; save(); ciz();}
function puan(id,n){const x=items.find(i=>i.id===id); if(x){x.puan=n;save();ciz()}}
function setD(id,d){const x=items.find(i=>i.id===id); if(x){x.durum=d;save();ciz()}}
function sil(id){items=items.filter(i=>i.id!==id);save();ciz()}
function filtre(v,el){f=v;document.querySelectorAll(".tabs .btn").forEach(b=>b.style.background=""); el.style.background="rgba(90,167,255,.2)";ciz()}
function ciz(){const L=items.filter(i=>f==="hepsi"||i.durum===f); box.innerHTML=L.map(i=>`<div class="card"><div style="display:flex;justify-content:space-between"><b>${i.ad}</b><span class="tag">${i.tur}</span></div><p class="sub">${lab[i.durum]}</p><div class="stars">${[1,2,3,4,5].map(n=>`<span onclick="puan('${i.id}',${n})" style="cursor:pointer">${n<=i.puan?"*":"o"}</span>`).join("")}</div><div style="margin-top:10px;display:flex;gap:6px;flex-wrap:wrap"><button class="btn" onclick="setD('${i.id}','sirada')">Sirada</button><button class="btn" onclick="setD('${i.id}','izliyorum')">Izle</button><button class="btn" onclick="setD('${i.id}','bitti')">Bitti</button><button class="btn" onclick="sil('${i.id}')">Sil</button></div></div>`).join("")||"<p class='sub'>Liste bos.</p>";}
ciz();
</script></body></html>
